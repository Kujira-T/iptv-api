name: Upstream Sync & Docker Build

on:
  schedule:
    # 每天北京时间凌晨 04:00 (UTC 20:00) 自动检查并同步上游
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  sync:
    name: Sync with Upstream
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync upstream changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/Guovern/iptv-api.git || true
          git fetch upstream master
          git checkout master
          if git merge upstream/master -m "chore: sync upstream changes"; then
            git push origin master
          else
            echo "Already up to date."
          fi

  build:
    name: Build & Push GHCR Image
    needs: sync
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/kujira-t/iptv-api:latest
          platforms: linux/amd64
